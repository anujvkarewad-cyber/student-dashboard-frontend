name: Retired unsigned preview APK path
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refuse-unsafe-build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the signed OTA-capable build path
        run: |
          echo "::error::Use production-apk.yml with mandatory OTA, verified original signing and publish_live=false."
          exit 1
