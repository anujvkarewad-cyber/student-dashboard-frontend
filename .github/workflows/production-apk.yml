name: Verify Existing Signed APK - Private Owner Test Only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPM_OTA_CHANNEL: production
      UPM_COMPILED_COMMIT: 7c159242915ab7732e4797469fcc8c6c1d66c4c2
      UPM_COMPILED_RUN_ID: '39589263514'
      UPM_PREFLIGHT_RUNTIME: c6f0d2d4fd135176619a3301aeb019d04aeb3cc1
      EXPECTED_APK_SHA256: e6ef23b29573a93aaa347a1ba63953d6deb0f9553be91472468f3562a43176c3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only binary verification tools
        run: |
          python -m pip install --no-cache-dir -r mobile/tools/apk-verification-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apksigner
      - name: Test binary metadata verifier fixtures
        run: python mobile/test/test_built_apk_verifier.py
      - name: Download only the pinned original signed APK
        uses: actions/download-artifact@v4
        with:
          name: NOT-FOR-INSTALL-signed-apk-diagnostics
          run-id: 39589263514
          github-token: ${{ github.token }}
          path: private-input
      - name: Verify exact bytes, original signer, binary manifest and SDK fingerprint asset
        run: |
          set -euo pipefail
          python mobile/tools/verify-built-apk.py private-input/app-release.apk
          cp private-input/app-release.apk UPM-v1.15.3-47-release.apk
          sha256sum UPM-v1.15.3-47-release.apk
      - name: Upload private owner-test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: UPM-v1.15.3-47-owner-test
          path: |
            UPM-v1.15.3-47-release.apk
            candidate-build-evidence.json
            PRIVATE-APK-TEST-NOTES.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
