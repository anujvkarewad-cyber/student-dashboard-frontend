name: Production Signed APK - Live Channel
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        required: false
        default: 'MCQ sync improvements'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/production-apk.yml'
permissions:
  contents: write
concurrency:
  group: prod-apk-main
  cancel-in-progress: false
jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_USE_MOCKS: "false"
      EXPO_PUBLIC_BACKEND_MODE: "live"
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android-release-key.jks
            echo "Keystore decoded"
          else
            echo "::warning::No keystore secret - building unsigned preview"
          fi
      - name: Install deps
        working-directory: mobile
        run: npm ci
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Configure signing
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret, skipping"
            exit 0
          fi
          echo "MYAPP_RELEASE_STORE_FILE=../android-release-key.jks" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> gradle.properties
      - name: Build signed release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Get version info
        id: meta
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "apk_name=UPM-v${VERSION}-${CODE}-release.apk" >> $GITHUB_OUTPUT
      - name: Rename APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk ${{ steps.meta.outputs.apk_name }}
          ls -lh ${{ steps.meta.outputs.apk_name }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.meta.outputs.apk_name }}
          retention-days: 30
          compression-level: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.code }}
          name: UPM v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.code }})
          body: |
            ${{ inputs.release_notes }}
            Version: ${{ steps.meta.outputs.version }}
            Code: ${{ steps.meta.outputs.code }}
          files: ${{ steps.meta.outputs.apk_name }}
      - name: Push APK to UPM-Android-Releases repo
        env:
          RELEASES_PAT: ${{ secrets.RELEASES_PAT }}
        run: |
          if [ -z "$RELEASES_PAT" ]; then
            echo "No PAT, skipping push to releases repo"
            exit 0
          fi
          git clone https://x-access-token:${RELEASES_PAT}@github.com/anujvkarewad-cyber/UPM-Android-Releases.git /tmp/releases
          cp ${{ steps.meta.outputs.apk_name }} /tmp/releases/
          echo "# UPM Android Releases" > /tmp/releases/README.md
          echo "" >> /tmp/releases/README.md
          echo "Last release: v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.code }}) on $(date -u +%Y-%m-%d)" >> /tmp/releases/README.md
          cd /tmp/releases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.code }}" || echo "no changes"
          git push origin main
