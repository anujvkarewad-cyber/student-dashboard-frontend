name: Private Signed APK - Owner Testing Only

# Manual private candidate only: original signing + mandatory OTA; no release/deployment steps.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Private owner-test candidate; not a student release.'
      ota_baseline:
        description: 'Mandatory true OTA; false blocks the build'
        type: boolean
        required: true
        default: true
      publish_live:
        description: 'Publish to the live release channel after build'
        type: boolean
        required: true
        default: false
  # APKs are explicit native releases only. Routine main changes use OTA.

permissions:
  contents: read

concurrency:
  group: private-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_USE_MOCKS: "false"
      EXPO_PUBLIC_BACKEND_MODE: "live"
      EXPO_PUBLIC_ALLOW_MODE_SWITCH: "false"
      # The origin is compiled into the bundle: without it config.gatewayOrigin
      # is empty and every request fails with "gateway is not configured".
      # This is the Cloud Run service that replaced the dead Vercel host.
      # Override it in repo variables (Settings > Secrets and variables >
      # Actions > Variables) when the host moves again.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://student-dashboard-566076646952.asia-south1.run.app' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      NODE_ENV: production
      UPM_APK_BUILD: "1"
      UPM_OTA_ENABLED: "1"
      UPM_OTA_CHANNEL: production
      EAS_PROJECT_ID: fc2cb9eb-e3f0-40b2-9a74-7c996902602c
    steps:
      - name: Refuse publication in owner-test workflow
        if: inputs.publish_live == true
        run: |
          echo "::error::Owner-test build only. Publication is not authorized."
          exit 1

      - name: Refuse a non-OTA APK request
        if: inputs.ota_baseline != true
        run: |
          echo "::error::Every new student APK requires true OTA."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require signing secrets (fail fast, no silent debug builds)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is NOT set. Add it in Settings > Secrets and variables > Actions."; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Refusing to build - without the release keystore the APK gets a random/public debug signature and existing users cannot update."
            exit 1
          fi
          echo "All signing secrets present."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: android-actions/setup-android@v3 is NOT used — the 2026-09 runner
      # image ships cmdline-tools 16.0 which removed the legacy 'tools'
      # package that action installs, so it crashes with exit code 1. The
      # ubuntu-latest runner already has the Android SDK preinstalled at
      # $ANDROID_HOME, so we install the needed packages directly.
      - name: Setup Python for binary APK verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install binary APK verification dependency
        run: python -m pip install --no-cache-dir -r mobile/tools/apk-verification-requirements.txt

      - name: Install Android packages (preinstalled SDK)
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Decode Keystore (mobile/ root - survives prebuild --clean)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/upm-release-key.jks
          if ! keytool -list -keystore mobile/upm-release-key.jks -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore decoded but STORE_PASSWORD does not open it. Check ANDROID_KEYSTORE_BASE64 / STORE_PASSWORD secrets."
            exit 1
          fi
          if ! keytool -list -keystore mobile/upm-release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::KEY_ALIAS not found in keystore. Check KEY_ALIAS secret."
            exit 1
          fi
          echo "Keystore decoded, password and alias verified."
          CERT=$(keytool -list -v -keystore mobile/upm-release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -oiE '[0-9a-f]{2}(:[0-9a-f]{2}){31}' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          node mobile/tools/check-release-identity.cjs "$CERT"
          keytool -list -v -keystore mobile/upm-release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -iE "alias|sha-?256" || true

      - name: Install deps (include test/typecheck tools even with NODE_ENV=production)
        working-directory: mobile
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Regression tests
        working-directory: mobile
        run: npm test

      - name: Regression-test the compiled APK evidence parser
        run: python3 mobile/test/test_built_apk_verifier.py

      - name: Verify new OTA baseline configuration (no publish)
        working-directory: mobile
        run: |
          node tools/ota-preflight.cjs --baseline-build > ../candidate-ota-preflight.json
          cat ../candidate-ota-preflight.json
          RUNTIME=$(node -p "require('../candidate-ota-preflight.json').runtimeVersion")
          echo "UPM_PREFLIGHT_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Wire release signing into generated Gradle files
        working-directory: mobile/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mv ../upm-release-key.jks app/upm-release-key.jks
          # CRITICAL: gradle.properties from prebuild has NO trailing newline.
          # Appending without this guard merges our first line into the last
          # generated property (expo.inlineModules.watchedDirectories) and
          # crashes expo autolinking's JSON.parse at projectsEvaluated.
          [ -n "$(tail -c 1 gradle.properties)" ] && printf '\n' >> gradle.properties
          cat >> gradle.properties <<PROPS
          MYAPP_RELEASE_STORE_FILE=upm-release-key.jks
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_STORE_PASSWORD=$STORE_PASSWORD
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          PROPS

          python3 - <<'PY'
          import re, sys, pathlib

          p = pathlib.Path('app/build.gradle')
          s = p.read_text()
          orig = s

          # 1) Insert a release signingConfig right after "signingConfigs {"
          if 'MYAPP_RELEASE_STORE_FILE' not in s:
              if 'signingConfigs {' not in s:
                  sys.exit('FATAL: signingConfigs block not found in build.gradle')
              release_cfg = """signingConfigs {
                  release {
                      if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                          storeFile file(MYAPP_RELEASE_STORE_FILE)
                          storePassword MYAPP_RELEASE_STORE_PASSWORD
                          keyAlias MYAPP_RELEASE_KEY_ALIAS
                          keyPassword MYAPP_RELEASE_KEY_PASSWORD
                      }
                  }"""
              s = s.replace('signingConfigs {', release_cfg, 1)

          # 2) In buildTypes, switch the RELEASE buildType (the 2nd occurrence of
          #    "signingConfig signingConfigs.debug" after "buildTypes {") to
          #    signingConfigs.release.
          bt = re.search(r'buildTypes\s*\{', s)
          if not bt:
              sys.exit('FATAL: buildTypes block not found in build.gradle')
          pat = re.compile(r'signingConfig signingConfigs\.debug')
          first = pat.search(s, bt.end())
          second = pat.search(s, first.end()) if first else None
          if second:
              s = s[:second.start()] + 'signingConfig signingConfigs.release' + s[second.end():]
          elif 'signingConfig signingConfigs.release' in s:
              print('Already patched, skipping step 2')
          else:
              sys.exit('FATAL: release signingConfig reference not found in buildTypes')

          if s == orig:
              sys.exit('FATAL: patch made no changes')
          p.write_text(s)
          print('build.gradle patched for release signing')
          PY

          grep -n "signingConfig signingConfigs" app/build.gradle

      - name: Bound Gradle memory after prebuild without changing signing
        run: python3 mobile/tools/configure-ci-gradle.py mobile/android/gradle.properties

      - name: Build signed release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --max-workers=2 --console=plain

      - name: Verify APK is signed with OUR keystore (not debug)
        id: verify_signature
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          KEY_OUT=$(keytool -list -v -keystore app/upm-release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1)
          echo "$KEY_OUT" | grep -iE "alias|sha-?256" || true
          # Works with both Java 8 ("SHA256: AA:..") and Java 9+ ("Certificate fingerprint (SHA-256): AA:..") formats
          KEY_SHA=$(echo "$KEY_OUT" | grep -oiE '[0-9a-f]{2}(:[0-9a-f]{2}){31}' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr 'A-F' 'a-f')
          echo "Keystore cert SHA-256: $KEY_SHA"
          echo "APK signer  SHA-256: $APK_SHA"
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          if [ -z "$KEY_SHA" ] || [ -z "$APK_SHA" ] || [ "$KEY_SHA" != "$APK_SHA" ]; then
            echo "::error::APK is NOT signed with the release keystore! Do not ship this build."
            exit 1
          fi
          node ../tools/check-release-identity.cjs "$APK_SHA"
          echo "SIGNATURE VERIFIED - APK matches the original released signing certificate"

      - name: Verify compiled package, OTA and signing evidence
        run: python3 mobile/tools/verify-built-apk.py mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Get version info
        id: meta
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "apk_name=UPM-v${VERSION}-${CODE}-release.apk" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk ${{ steps.meta.outputs.apk_name }}
          ls -lh ${{ steps.meta.outputs.apk_name }}
          sha256sum ${{ steps.meta.outputs.apk_name }}

      # Private artifacts only. Upload failure must fail this build; no release fallback.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: |
            ${{ steps.meta.outputs.apk_name }}
            candidate-build-evidence.json
            candidate-ota-preflight.json
            PRIVATE-APK-TEST-NOTES.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain signed APK privately for diagnosis if a later check fails
        if: failure() && steps.verify_signature.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NOT-FOR-INSTALL-signed-apk-diagnostics
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            candidate-build-evidence.json
            candidate-ota-preflight.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f mobile/upm-release-key.jks mobile/android/app/upm-release-key.jks
          rm -f mobile/android/gradle.properties
