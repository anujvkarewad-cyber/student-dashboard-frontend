name: Production Signed APK - Live Channel
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        required: false
        default: 'MCQ sync improvements'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/production-apk.yml'
permissions:
  contents: write
concurrency:
  group: prod-apk-main
  cancel-in-progress: false
jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_USE_MOCKS: "false"
      EXPO_PUBLIC_BACKEND_MODE: "live"
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
