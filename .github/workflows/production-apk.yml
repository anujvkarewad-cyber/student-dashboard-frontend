name: Private APK signing identity verification only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify existing signing key without exporting or publishing it
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing required signing secret: $name"; exit 1; fi
          done
          TMP_KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_KEY_DIR"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$TMP_KEY_DIR/original.jks"
          keytool -exportcert -keystore "$TMP_KEY_DIR/original.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" -file "$TMP_KEY_DIR/certificate.der" >/dev/null 2>&1
          CERT=$(openssl x509 -in "$TMP_KEY_DIR/certificate.der" -inform DER -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=e8854617b59d87d55e4da83031f15998b54622457de1912f930b0641aaf9074c
          if [ "$CERT" != "$EXPECTED" ]; then echo "::error::Signing certificate does not match verified release 46. No build allowed."; exit 1; fi
          printf 'Private signing access verification only. Not an APK.\n' > "$TMP_KEY_DIR/probe.txt"
          jar --create --file "$TMP_KEY_DIR/probe.jar" -C "$TMP_KEY_DIR" probe.txt
          jarsigner -keystore "$TMP_KEY_DIR/original.jks" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -signedjar "$TMP_KEY_DIR/signed-probe.jar" "$TMP_KEY_DIR/probe.jar" "$KEY_ALIAS" >/dev/null 2>&1
          jarsigner -verify "$TMP_KEY_DIR/signed-probe.jar" >/dev/null 2>&1
          echo "UPM_SIGNING_CERT_SHA256=$CERT"
          echo "UPM_EXISTING_KEY_PASSWORD_VERIFIED=true"
          echo "UPM_APK_COMPILED=false"
          echo "UPM_RELEASE_PUBLISHED=false"
