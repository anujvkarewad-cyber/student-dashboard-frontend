name: Auto Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # METHOD 1: Deploy Hook (Simplest)
      - name: Trigger Vercel Deploy Hook
        if: secrets.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Vercel Deploy Hook..."
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Hook triggered"

      # METHOD 2: Vercel CLI
      - name: Deploy with Vercel CLI
        if: secrets.VERCEL_TOKEN != '' && secrets.VERCEL_DEPLOY_HOOK_URL == ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Native integration info
        if: secrets.VERCEL_DEPLOY_HOOK_URL == '' && secrets.VERCEL_TOKEN == ''
        run: |
          echo "::notice::Assuming Vercel GitHub integration will auto-deploy."
