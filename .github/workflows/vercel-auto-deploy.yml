name: Auto Deploy to Vercel
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }} }
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then echo "Native Vercel integration will handle deploy"; exit 0; fi
          curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
      - run: echo "Vercel auto-deploy check done - connect repo in Vercel Dashboard > Settings > Git if needed"
