name: Generate Chapter MCQs

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mcq-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run MCQ generation (resumable)
        working-directory: content-pipeline
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-chapter-bank.js

      - name: Commit checkpoint to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-pipeline/state content-pipeline/generated content-pipeline/review content-pipeline/config
          if git diff --cached --quiet; then echo "no checkpoint changes"; else git commit -m "MCQ generation checkpoint" && git push origin main; fi

      - name: Upload generated chapters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-chapters
          path: content-pipeline/generated/
          if-no-files-found: warn

      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: content-pipeline/review/
          if-no-files-found: warn

      - name: Upload failed chapters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-chapters
          path: content-pipeline/state/failed-chapters.json
          if-no-files-found: warn
